{% extends "base.html" %}
{% block title %}Categories{% endblock %}
{% block content %}
<h3 class="page-title mb-3">Categories</h3>
<div class="row g-3">
  <div class="col-lg-4"><div class="card p-3">
    <h6 class="fw-bold">New category</h6>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">Name</label><input name="name" maxlength="60" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Colour</label><input type="color" name="color" class="form-control form-control-color" value="#4f46e5"></div>
      <button class="btn btn-brand w-100">Add category</button>
    </form>
  </div></div>
  <div class="col-lg-8"><div class="card p-3">
    <table class="table mb-0">
      <thead><tr><th>Category</th><th>Transactions</th><th class="text-end">Action</th></tr></thead>
      <tbody>
      {% for c in rows %}
        <tr><td><span class="dot" style="background:{{ c.color }}"></span>{{ c.name }}</td><td>{{ c.n }}</td>
          <td class="text-end"><form method="post" action="{{ url_for('delete_category', cid=c.id) }}" class="d-inline" data-confirm="Delete '{{ c.name }}'? Its transactions will become Uncategorized.">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button></form></td></tr>
      {% endfor %}
      </tbody>
    </table>
  </div></div>
</div>
{% endblock %}
