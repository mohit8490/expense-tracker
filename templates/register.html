<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register · SpendWise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="auth-wrap">
  <div class="card auth-card p-4 p-md-5">
    <div class="text-center mb-4">
      <div class="fs-1 text-primary"><i class="bi bi-person-plus"></i></div>
      <h3 class="fw-bold mb-0">Create account</h3>
      <div class="text-body-secondary">Start tracking your money today.</div>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="alert alert-{{ cat }} py-2">{{ msg }}</div>{% endfor %}
    {% endwith %}
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">Full name</label>
        <input name="name" class="form-control" value="{{ name or '' }}" required></div>
      <div class="mb-3"><label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ email or '' }}" required></div>
      <div class="row g-3 mb-4">
        <div class="col-6"><label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" minlength="6" required></div>
        <div class="col-6"><label class="form-label">Confirm</label>
          <input type="password" name="confirm" class="form-control" minlength="6" required></div>
      </div>
      <button class="btn btn-brand w-100 py-2">Sign up</button>
    </form>
    <div class="text-center mt-3 small">Already registered? <a href="{{ url_for('login') }}">Log in</a></div>
  </div>
</div>
</body>
</html>
